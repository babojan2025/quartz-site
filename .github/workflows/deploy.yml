name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main  # или другая ветка, если используешь другую

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: './dist'  # путь к папке сборки (в Vite это обычно dist)

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
